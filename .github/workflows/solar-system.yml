name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup NodeJS Version
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # טעינת הנתונים מתוך הנתיב הנכון
      - name: Populate Database
        run: |
          node -e '
            const mongoose = require("mongoose");
            const fs = require("fs");
            const path = require("path");
            
            async function seed() {
              await mongoose.connect(process.env.MONGO_URI);
              
              // בדיקה באיזה נתיב נמצא קובץ ה-JSON
              let filePath = "models/planets.json";
              if (!fs.existsSync(filePath)) filePath = "solar-system.json";
              if (!fs.existsSync(filePath)) filePath = "planets.json";
              
              console.log("Loading data from:", filePath);
              const data = JSON.parse(fs.readFileSync(filePath, "utf8"));
              const db = mongoose.connection.db;
              await db.collection("planets").deleteMany({});
              await db.collection("planets").insertMany(data);
              console.log("Database successfully seeded with planets!");
              await mongoose.disconnect();
            }
            seed().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Unit Testing
        run: npx mocha app-test.js --timeout 10000 --exit

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Mocha-Test-Result
          path: test-results.xml