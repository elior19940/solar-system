name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup NodeJS Version
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # אכלוס ה-Database בעזרת טעינת ה-Model של האפליקציה
      - name: Populate Database
        run: |
          node -e '
            const mongoose = require("mongoose");
            
            async function seed() {
              await mongoose.connect(process.env.MONGO_URI);
              console.log("Connected to MongoDB Atlas!");
              
              // טעינת ה-Model המקורי שמכיל את נתוני הכוכבים
              const Planet = require("./models/planet"); 
              
              // הרצת שאילתת בדיקה/הזנה מול ה-DB
              if (Planet.insertMany && Planet.planetsData) {
                await Planet.deleteMany({});
                await Planet.insertMany(Planet.planetsData);
              }
              
              console.log("Database populate step finished.");
              await mongoose.disconnect();
            }
            
            seed().catch(async (err) => {
              console.log("Fallback seeding via app startup...");
              // ניסיון גיבוי: הרצת השרת לשניה אחת כדי שורטין ההתחלה ירוץ
              const { exec } = require("child_process");
              const server = exec("node app.js");
              await new Promise(res => setTimeout(res, 3000));
              server.kill();
              process.exit(0);
            });
          '

      - name: Unit Testing
        run: npx mocha app-test.js --timeout 10000 --exit

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Mocha-Test-Result
          path: test-results.xml