name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup NodeJS Version
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # חיפוש דינמי של קובץ ה-JSON וטעינת הנתונים
      - name: Populate Database
        run: |
          node -e '
            const mongoose = require("mongoose");
            const fs = require("fs");
            const path = require("path");

            function findJsonFile(dir) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                if (file === "node_modules" || file === ".git") continue;
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  const res = findJsonFile(fullPath);
                  if (res) return res;
                } else if (file.endsWith(".json") && file !== "package.json" && file !== "package-lock.json") {
                  const content = fs.readFileSync(fullPath, "utf8");
                  if (content.includes("Mercury") || content.includes("Earth")) {
                    return fullPath;
                  }
                }
              }
              return null;
            }

            async function seed() {
              const filePath = findJsonFile(".");
              if (!filePath) {
                throw new Error("Could not find planet JSON data file in repository!");
              }
              console.log("Found data file at:", filePath);

              await mongoose.connect(process.env.MONGO_URI);
              const data = JSON.parse(fs.readFileSync(filePath, "utf8"));
              const db = mongoose.connection.db;
              await db.collection("planets").deleteMany({});
              await db.collection("planets").insertMany(data);
              console.log("Database successfully seeded!");
              await mongoose.disconnect();
            }

            seed().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Unit Testing
        run: npx mocha app-test.js --timeout 10000 --exit

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Mocha-Test-Result
          path: test-results.xml